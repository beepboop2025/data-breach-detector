[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-breach-detector"
version = "0.2.0"
description = "Read-only breach-intelligence MCP: reports THAT an organization was breached and which data types leaked, across full history from public feeds (HaveIBeenPwned, RansomLook, ransomwatch archive, SEC 8-K 1.05). Never the leaked data."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "beepboop2025" }]
keywords = ["mcp", "security", "threat-intelligence", "breach", "haveibeenpwned", "ransomware"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.9.0,<2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/beepboop2025/data-breach-detector"
Repository = "https://github.com/beepboop2025/data-breach-detector"

[project.scripts]
data-breach-detector = "data_breach_detector.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_breach_detector"]
