name: tests

# Nothing gated a merge before this: the only workflows in the repo published
# to PyPI and to the MCP registry, both tag or dispatch driven, so broken code
# reached the release path unopposed. This runs on every push and PR instead.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from requires-python and the version the publish job builds
        # with: the redaction and pagination code is version sensitive enough
        # (datetime.fromisoformat gained ISO forms in 3.11) to test both ends.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --quiet -e . pytest
      - run: python -m pytest -q
