name: Set MCP Registry version status

# Changes the lifecycle status of earlier registry versions of this server
# (active, deprecated or deleted) without publishing anything. Use it when a
# release retires something older versions still advertise: versions 0.1.0
# to 0.3.2 list the hosted endpoint retired on 23 November 2026.
#
# Same trust model as registry-publish.yml: GitHub OIDC, no stored secret,
# the publisher pinned by version and sha256. The server name comes from the
# committed server.json, so this only ever touches this server. Inputs reach
# the shell through environment variables and are validated before the
# publisher is downloaded, and the version server.json carries (the current
# release) can only be set active.
#
# Run it with, for example:
#   gh workflow run registry-status.yml -f status=deprecated \
#     -f versions="0.1.0 0.2.0 0.2.2 0.3.0 0.3.1 0.3.2" \
#     -f message="The hosted endpoint was retired on 23 November 2026. Version 0.4.0 runs locally: pip install data-breach-detector."

on:
  workflow_dispatch:
    inputs:
      status:
        description: "New status"
        required: true
        type: choice
        options: [deprecated, deleted, active]
        default: deprecated
      versions:
        description: "Space-separated versions, for example: 0.3.1 0.3.2"
        required: true
        type: string
      message:
        description: "Shown beside a deprecated or deleted version (leave empty for active)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: "1.8.1"
  MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"

jobs:
  registry-status:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Validate inputs
        env:
          STATUS: ${{ inputs.status }}
          VERSIONS: ${{ inputs.versions }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          set -f  # no globbing while splitting the version list
          current=$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')
          count=0
          for v in $VERSIONS; do
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a version: $v"; exit 1; }
            if [[ "$v" == "$current" && "$STATUS" != "active" ]]; then
              echo "::error::$v is the current release in server.json; refusing to mark it $STATUS"
              exit 1
            fi
            count=$((count + 1))
          done
          [[ $count -gt 0 ]] || { echo "::error::no versions given"; exit 1; }
          if [[ "$STATUS" == "active" && -n "$MESSAGE" ]]; then
            echo "::error::a message is not allowed with status active"; exit 1
          fi
          [[ ${#MESSAGE} -le 300 ]] || { echo "::error::message is longer than 300 characters"; exit 1; }
          echo "$count version(s) -> $STATUS"

      - name: Install mcp-publisher (pinned + checksum-verified)
        run: |
          curl -fsSLo mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher

      - name: Authenticate by OIDC and set the status
        env:
          STATUS: ${{ inputs.status }}
          VERSIONS: ${{ inputs.versions }}
          MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          set -f
          name=$(python3 -c 'import json; print(json.load(open("server.json"))["name"])')
          ./mcp-publisher login github-oidc
          for v in $VERSIONS; do
            if [[ -n "$MESSAGE" ]]; then
              ./mcp-publisher status --status "$STATUS" --message "$MESSAGE" "$name" "$v"
            else
              ./mcp-publisher status --status "$STATUS" "$name" "$v"
            fi
          done
